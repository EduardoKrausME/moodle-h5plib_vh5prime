# Publishing authorization is your claimed listing: the service checks that
# this repository is the listed source of your entry, by permanent repository
# id. camp CI still independently rebuilds and verifies everything from the
# public tag, and a human merges. Prefer holding a token yourself? The
# personal-access-token flow remains supported: templates/author-release-pat.yml.

name: Publish release to camp

on: [push]

env:
  CAMP_INDEX_REPO: camp-registry/camp-index  # the camp index repository
  CAMP_PUBLISH_URL: https://publish.camp-registry.org/publish
  COMPONENT: ""
  SUPPORTED_MOODLE: ""

jobs:
  # Quando você executa manualmente no MASTER:
  # 1. lê $plugin->release
  # 2. cria "V <release>"
  # 3. dispara este workflow novamente usando a TAG
  prepare-tag:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: write

    steps:
      - name: Require master
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::Run this workflow from master. Current ref: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Check out master
        uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0

      - name: Create release tag from version.php
        id: release-tag
        shell: bash
        run: |
          RELEASE=$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("plugin/version.php").read_text()

          match = re.search(
              r'\$plugin->release\s*=\s*["\']([^"\']+)["\']\s*;',
              text
          )

          if not match:
              raise SystemExit(
                  "$plugin->release was not found in plugin/version.php"
              )

          print(match.group(1).strip())
          PY
          )

          if [ -z "$RELEASE" ]; then
            echo "::error::Could not read \$plugin->release from version.php"
            exit 1
          fi

          TAG="V ${RELEASE}"

          echo "Release: ${RELEASE}"
          echo "Tag: ${TAG}"

          git -C plugin fetch --tags --force

          if git -C plugin rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git -C plugin rev-list -n 1 "${TAG}")

            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "::error::Tag '${TAG}' already exists at ${TAG_SHA}, but master is ${GITHUB_SHA}."
              echo "::error::Update \$plugin->release before publishing a new release."
              exit 1
            fi

            echo "Tag '${TAG}' already points to this master commit; reusing it."
          else
            git -C plugin config user.name "github-actions[bot]"
            git -C plugin config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git -C plugin tag "${TAG}" "${GITHUB_SHA}"
            git -C plugin push origin "refs/tags/${TAG}"

            echo "Created and pushed '${TAG}'."
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish generated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          gh workflow run camp-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"

          echo "Dispatched CAMP publication for '${RELEASE_TAG}'."

  # Esta segunda execução acontece já sobre a TAG,
  # portanto o OIDC do CAMP é aceito.
  publish:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out plugin at the tag
        uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0

      - name: Check out camp index
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CAMP_INDEX_REPO }}
          path: index-repo

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install camp tools
        run: |
          pip install --quiet \
            "git+https://github.com/camp-registry/camp-tools@v0.2.53"

      - name: Resolve component name
        run: |
          if [ -z "${COMPONENT}" ]; then
            COMPONENT=$(sed -nE \
              's/.*\$plugin->component[[:space:]]*=[[:space:]]*.?([a-z][a-z0-9_]*).?[[:space:]]*;.*/\1/p' \
              plugin/version.php | head -1)
          fi

          if [ -z "${COMPONENT}" ]; then
            echo "::error::COMPONENT is empty and \$plugin->component was not found in version.php"
            exit 1
          fi

          echo "COMPONENT=${COMPONENT}" >> "$GITHUB_ENV"
          echo "component: ${COMPONENT}"

      - name: Require a listing manifest
        run: camp scaffold plugin --check

      - name: Label heuristics + security lint
        run: |
          camp lint-labels plugin || true
          camp audit plugin || true

      - name: Compute and append the release record
        run: |
          plugintype="${COMPONENT%%_*}"

          camp release \
            "index-repo/plugins/${plugintype}/${COMPONENT}.yml" \
            "${GITHUB_REF_NAME}" \
            --source ./plugin \
            ${SUPPORTED_MOODLE:+--supported-moodle "${SUPPORTED_MOODLE}"}

      - name: Publish
        run: |
          CAMP_OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=camp-publish" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          export CAMP_OIDC_TOKEN
          export TAG="${GITHUB_REF_NAME}"

          python3 <<'EOF'
          import json
          import os
          import sys
          import urllib.request
          import yaml

          component = os.environ["COMPONENT"]
          tag = os.environ["TAG"]

          path = (
              f"index-repo/plugins/"
              f"{component.split('_')[0]}/"
              f"{component}.yml"
          )

          with open(path) as f:
              record = yaml.safe_load(f)["releases"][-1]

          assert record["tag"] == tag, \
              "computed record is not for this tag"

          body = json.dumps({
              "token": os.environ["CAMP_OIDC_TOKEN"],
              "component": component,
              "tag": tag,
              "record": record,
          }).encode()

          req = urllib.request.Request(
              os.environ["CAMP_PUBLISH_URL"],
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": f"camp-release ({component})",
              },
          )

          try:
              out = json.load(urllib.request.urlopen(req))
          except urllib.error.HTTPError as e:
              raw = e.read().decode(errors="replace")

              try:
                  out = json.loads(raw)
                  msg = (
                      f"({out.get('code')}): "
                      f"{out.get('message')}"
                  )
              except ValueError:
                  msg = f"HTTP {e.code}: {raw[:200]}"

              print(f"::error::camp publish refused {msg}")
              sys.exit(1)

          print("Release PR:", out["pr"])

          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary:
              with open(summary, "a") as f:
                  f.write(
                      f"Release PR: {out['pr']}\n\n"
                      "camp CI will independently rebuild the artifact "
                      "from the tag and verify the recorded hashes "
                      "before this can merge.\n"
                  )
          EOF